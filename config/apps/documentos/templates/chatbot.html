
<div id="legaltech-chatbot">

    <!-- Botón flotante -->
    <button id="chatbot-toggle" type="button"
            aria-label="Abrir asistente"
            aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/>
        </svg>
    </button>

    <!-- Ventana del chatbot -->
    <section id="chatbot-window"
             role="dialog"
             aria-label="Asistente de documentos"
             aria-hidden="true">

        <header class="chatbot-header">
            <div>
                <strong>Asistente LegalTech</strong>
                <span>Recomendador de documentos</span>
            </div>

            <button id="chatbot-close" type="button"
                    aria-label="Cerrar chatbot">
                &times;
            </button>
        </header>

        <div id="chatbot-messages" aria-live="polite">
            <div class="chatbot-message bot">
                Hola. Puedo ayudarte a encontrar el documento que necesitas.
                Describe brevemente qué trámite o situación quieres resolver.
                <small>Evita incluir datos personales.</small>
            </div>
        </div>

        <div id="chatbot-result"></div>

        <form id="chatbot-form">
            {% csrf_token %}
            <div class="textarea-container">
                            <textarea
                id="chatbot-input"
                placeholder="¿Qué documento necesitas?"
                rows="2"
                maxlength="3000"
                required></textarea>

            <button id="chatbot-send" type="submit">
                Enviar
            </button>
            </div>

        </form>

    </section>
</div>

<style>
/* Contenedor principal */
#legaltech-chatbot {
    --chat-primary: #263b68;
    --chat-primary-hover: #1c2d50;
    --chat-background: #ffffff;
    --chat-text: #263238;
    --chat-muted: #718096;
    --chat-border: #e2e8f0;

    font-family: inherit;
    color: var(--chat-text);
}

/* Botón flotante */
#legaltech-chatbot #chatbot-toggle {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 60px;
    height: 60px;
    border: none;
    border-radius: 50%;
    background: var(--chat-primary);
    color: white;
    cursor: pointer;
    z-index: 9998;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0,0,0,.2);
    transition: transform .2s, background .2s;
}

#legaltech-chatbot #chatbot-toggle:hover {
    background: var(--chat-primary-hover);
    transform: scale(1.06);
}

#legaltech-chatbot #chatbot-toggle svg {
    width: 27px;
    height: 27px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* Ventana */
#legaltech-chatbot #chatbot-window {
    position: fixed;
    bottom: 100px;
    right: 25px;
    width: 360px;
    height: 480px;
    max-height: calc(100vh - 125px);
    background: var(--chat-background);
    border: 1px solid var(--chat-border);
    border-radius: 14px;
    box-shadow: 0 8px 35px rgba(0,0,0,.18);
    z-index: 9999;
    display: none;
    flex-direction: column;
    overflow: hidden;
}

#legaltech-chatbot #chatbot-window.open {
    display: flex;
}

/* Cabecera */
#legaltech-chatbot .chatbot-header {
    background: var(--chat-primary);
    color: white;
    padding: 17px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#legaltech-chatbot .chatbot-header div {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

#legaltech-chatbot .chatbot-header strong {
    font-size: 15px;
}

#legaltech-chatbot .chatbot-header span {
    font-size: 12px;
    opacity: .8;
}

#legaltech-chatbot #chatbot-close {
    background: none;
    border: none;
    color: white;
    font-size: 27px;
    cursor: pointer;
}

/* Mensajes */
#legaltech-chatbot #chatbot-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
}

#legaltech-chatbot .chatbot-message {
    box-sizing: border-box;
    width: fit-content;
    max-width: 90%;
    margin: 0;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
    text-align: left;
    white-space: normal;
    overflow-wrap: anywhere;
    text-indent: 0;
}

#legaltech-chatbot .chatbot-message.bot {
    align-self: flex-start;
    background: #f0f3f8;
}

#legaltech-chatbot .chatbot-message small {
    display: block;
    margin: 8px 0 0;
    padding: 0;
    color: #718096;
    font-size: 11px;
    text-indent: 0;
}

/* Resultado */
#legaltech-chatbot #chatbot-result {
    padding: 0 16px;
}

#legaltech-chatbot .chatbot-recommendation {
    background: #f0f5ff;
    border: 1px solid #d6e2f5;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    font-size: 13px;
}

#legaltech-chatbot .chatbot-recommendation strong {
    display: block;
    margin-bottom: 6px;
}

#legaltech-chatbot .chatbot-recommendation p {
    margin: 5px 0 12px;
    line-height: 1.5;
}

#legaltech-chatbot .chatbot-recommendation a {
    display: block;
    text-align: center;
    background: var(--chat-primary);
    color: white;
    padding: 9px;
    border-radius: 7px;
    text-decoration: none;
    font-weight: 600;
}

#legaltech-chatbot .chatbot-recommendation a:hover {
    background: var(--chat-primary-hover);
}

/* Formulario */
#legaltech-chatbot #chatbot-form {
    padding: 13px;
    border-top: 1px solid var(--chat-border);
    display: flex;
    gap: 8px;
    align-items: flex-end;
}

#legaltech-chatbot #chatbot-input {
    flex: 1;
    min-width: 0;
    resize: none;
    border: 1px solid var(--chat-border);
    border-radius: 9px;
    padding: 10px;
    font: inherit;
    font-size: 13px;
    outline: none;
}

#legaltech-chatbot #chatbot-input:focus {
    border-color: var(--chat-primary);
}

#legaltech-chatbot #chatbot-send {
    background: var(--chat-primary);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px 13px;
    cursor: pointer;
}

#legaltech-chatbot #chatbot-send:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#legaltech-chatbot .textarea-container {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    width: 100%;
    gap: 8px;
}

#legaltech-chatbot .textarea-container textarea {
    width: 100%;
    box-sizing: border-box;
}

#legaltech-chatbot .textarea-container button {
    align-self: flex-end;
    margin: 0;
}

/* Adaptación móvil */
@media (max-width: 480px) {
    #legaltech-chatbot #chatbot-window {
        width: auto;
        left: 12px;
        right: 12px;
        bottom: 90px;
        height: min(480px, calc(100vh - 110px));
    }

    #legaltech-chatbot #chatbot-toggle {
        right: 18px;
        bottom: 18px;
    }
}
</style>

<script>
(function () {
    const root = document.getElementById("legaltech-chatbot");

    if (!root || root.dataset.initialized) return;
    root.dataset.initialized = "true";

    const toggle = root.querySelector("#chatbot-toggle");
    const close = root.querySelector("#chatbot-close");
    const windowChat = root.querySelector("#chatbot-window");
    const form = root.querySelector("#chatbot-form");
    const input = root.querySelector("#chatbot-input");
    const send = root.querySelector("#chatbot-send");
    const messages = root.querySelector("#chatbot-messages");
    const result = root.querySelector("#chatbot-result");
    const csrfToken = root.querySelector(
        '[name="csrfmiddlewaretoken"]'
    ).value;

    const urlGenerar = "{% url 'documentos:generar_documento' 0 %}";

    function abrirChat() {
        windowChat.classList.add("open");
        windowChat.setAttribute("aria-hidden", "false");
        toggle.setAttribute("aria-expanded", "true");
        input.focus();
    }

    function cerrarChat() {
        windowChat.classList.remove("open");
        windowChat.setAttribute("aria-hidden", "true");
        toggle.setAttribute("aria-expanded", "false");
    }

    toggle.addEventListener("click", () => {
        windowChat.classList.contains("open")
            ? cerrarChat()
            : abrirChat();
    });

    close.addEventListener("click", cerrarChat);

    function agregarMensaje(texto, tipo) {
        const message = document.createElement("div");
        message.className = `chatbot-message ${tipo}`;
        message.textContent = texto;
        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
    }

    function mostrarRecomendacion(recomendacion) {
        result.replaceChildren();

        if (recomendacion.plantilla_id === null) {
            agregarMensaje(
                recomendacion.explicacion ||
                "No encontramos una plantilla adecuada. Puedes revisar la biblioteca manualmente.",
                "bot"
            );
            return;
        }

        const card = document.createElement("div");
        card.className = "chatbot-recommendation";

        const title = document.createElement("strong");
        title.textContent = recomendacion.nombre;

        const explanation = document.createElement("p");
        explanation.textContent = recomendacion.explicacion;

        const link = document.createElement("a");
        link.textContent = "Iniciar formulario";
        link.href = urlGenerar.replace(/0\/$/, `${recomendacion.plantilla_id}/`);

        card.append(title, explanation, link);
        result.appendChild(card);
        messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const descripcion = input.value.trim();

        if (!descripcion || send.disabled) return;

        agregarMensaje(descripcion, "user");
        input.value = "";
        result.replaceChildren();

        send.disabled = true;
        send.textContent = "...";

        const loading = document.createElement("div");
        loading.className = "chatbot-message bot";
        loading.textContent = "Buscando la plantilla más adecuada...";
        messages.appendChild(loading);

        try {
            const response = await fetch("/chatbot/recomendar/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrfToken
                },
                body: JSON.stringify({ descripcion })
            });

            const data = await response.json();
            loading.remove();

            if (!response.ok || !data.success) {
                throw new Error(data.error || "No fue posible consultar al asistente.");
            }

            mostrarRecomendacion(data.recomendacion);

        } catch (error) {
            loading.remove();

            agregarMensaje(
                "No fue posible obtener una recomendación. Puedes seleccionar una plantilla directamente desde la biblioteca.",
                "bot"
            );

            console.error("Error del chatbot:", error);

        } finally {
            send.disabled = false;
            send.textContent = "Enviar";
        }
    });
})();
</script>
